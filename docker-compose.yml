services:
  portal:
    build: .
    image: ddwrt-portal:dev
    restart: unless-stopped
    # Loopback only: the portal serves plain HTTP.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      POLL_INTERVAL: "60"
    volumes:
      - portal-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  portal-data:
