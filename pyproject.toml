[project]
name = "ddwrt-portal"
version = "0.1.0"
description = "Central management portal for DD-WRT access points"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.17",
    "cryptography>=43",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
